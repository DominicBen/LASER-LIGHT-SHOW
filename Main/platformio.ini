; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
lib_deps = 
	adafruit/Adafruit MCP4725@^2.0.0
	paulstoffregen/ILI9341_t3@0.0.0-alpha+sha.ff4bba3e15

; See https://github.com/platformio/platform-teensy/issues/65
; activate Dual USB just as README says
; build_type = debug
build_flags =
    -DUSB_DUAL_SERIAL
    -DDEBUG                   # Comment out to disable debugging.

build_unflags = 
    -DUSB_SERIAL

debug_port = \\.\COM6
debug_tool = custom
debug_load_mode = manual
debug_server = 
debug_init_cmds =
  target extended-remote $DEBUG_PORT
  $INIT_BREAK
  define pio_reset_run_target
  interrupt
  tbreak loop
  continue
  end
  define pio_restart_target
  echo Restart is undefined for now.
  end

debug_init_break =
